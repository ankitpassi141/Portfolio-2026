<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-title" content="Ankit Passi">
<link rel="manifest" href="/images/favicon/site.webmanifest">

<title>Ankit Passi — Senior Product Designer</title>
<meta name="description" content="Ankit Passi, senior product designer. Eight years across enterprise assessment products and governance UX, now working on an innovation platform.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/background-music.css">
  <!-- SEO:START (generated by scripts/sync-seo-meta.ps1 from seo-data.json - do not hand-edit this block) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://ankitpassi.in/">
<meta property="og:title" content="Ankit Passi - Senior Product Designer">
<meta property="og:description" content="Ankit Passi, Product designer. Eight years across EdTech products &amp; UX, now working on solving enterprise UX problems.">
<meta property="og:image" content="https://ankitpassi.in/images/og-default.jpg">
<meta property="og:site_name" content="Ankit Passi">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ankit Passi - Senior Product Designer">
<meta name="twitter:description" content="Ankit Passi, Product designer. Eight years across EdTech products &amp; UX, now working on solving enterprise UX problems.">
<meta name="twitter:image" content="https://ankitpassi.in/images/og-default.jpg">
<!-- SEO:END -->
</head>
<body>

<div class="page">
<div class="frame">

  <header class="topbar">
    <span class="topbar__id"><span style="font-weight:500">Ankit Passi</span><span class="role">Senior Product Designer</span></span>
    <span class="topbar__meta">
      <span id="bgmSlot" class="bgm-slot"></span>
      <span class="topbar__divider" aria-hidden="true"></span>
      <span class="availability"><span class="availability__dot"></span>Always open for a conversation</span>
      <button class="hamburger" id="navToggle" aria-label="Open navigation" aria-expanded="false" aria-controls="navCard">☰</button>
    </span>
  </header>

  <div class="grid">

    <!-- Profile — content rendered from js/home-content-data.js -->
    <div class="card card--profile">
      <div class="card__bar"><h2 class="card__title">Profile</h2></div>
      <div class="profile__body" id="profileBody"></div>
      <div class="card__foot" id="profileFoot"></div>
    </div>

    <!-- Work gallery — cards rendered from js/home-content-data.js -->
    <div class="card card--gallery">
      <div class="card__bar card__bar--tint">
        <h2 class="card__title">Work gallery</h2>
        <span class="card__bar-meta" id="galleryCount" data-gallery-count>03</span>
      </div>
      <div class="gallery__folders js-work-gallery" id="galleryFolders"></div>
    </div>

    <!-- What else I'm upto — rows rendered from js/home-content-data.js -->
    <div class="card card--nav" id="navCard" hidden>
      <div class="card__bar">
        <h2 class="card__title">What else I'm upto!</h2>
        <button class="nav-close" id="navClose" aria-label="Close navigation">✕</button>
      </div>
      <nav class="drawer"></nav>
    </div>

    <!-- Experience -->
    <div class="card card--experience">
      <div class="card__bar card__bar--tint">
        <h2 class="card__title">Experience</h2>
        <span class="card__bar-meta" id="experienceCount">03 roles</span>
      </div>
      <div class="experience__body" id="experienceBody"></div>
      <div class="card__foot" id="experienceFoot"></div>
    </div>

    <!-- Mentoring — content rendered from js/home-content-data.js -->
    <a class="card card--mentoring card--interactive" data-social="adplist" href="#">
      <div class="card__bar card__bar--tint"><h2 class="card__title">Mentoring</h2></div>
      <div class="mentoring__body">
        <div class="mentoring__grid" id="mentoringGrid"></div>
        <div class="mentoring__foot" id="mentoringNote"></div>
      </div>
      <div class="card__foot" id="mentoringCta"></div>
    </a>

    <!-- About — content rendered from js/home-content-data.js -->
    <a class="card card--about card--interactive" href="about.html">
      <div class="card__bar card__bar--tint"><h2 class="card__title">About&nbsp; me</h2></div>
      <div class="about__body">
        <div class="about__image"></div>
        <div class="about__content" id="aboutContent"></div>
      </div>
      <div class="card__foot" id="aboutFoot"></div>
    </a>

  </div>

  <footer class="pagefoot">
    <div class="wordmark">ANKIT PASSI</div>
    <div class="pagefoot__links">
      <div class="contact-menu">
        <button type="button" class="contact-trigger" id="contactTrigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="contactPopup">Let's Connect</button>
        <div class="contact-popup" id="contactPopup" role="dialog" aria-modal="false" aria-label="Contact links" hidden>
          <a class="contact-popup__row" data-social="linkedin" href="#" aria-label="LinkedIn">
            <span class="contact-popup__icon contact-popup__icon--linkedin" aria-hidden="true"></span>
            <span class="contact-popup__text">
              <span class="contact-popup__label">LinkedIn</span>
              <span class="contact-popup__hint" data-social-hint></span>
            </span>
          </a>
          <a class="contact-popup__row" data-social="instagram" href="#" aria-label="Instagram">
            <span class="contact-popup__icon contact-popup__icon--instagram" aria-hidden="true"></span>
            <span class="contact-popup__text">
              <span class="contact-popup__label">Instagram</span>
              <span class="contact-popup__hint" data-social-hint></span>
            </span>
          </a>
          <a class="contact-popup__row" data-social="email" href="#" aria-label="Email">
            <span class="contact-popup__icon contact-popup__icon--email" aria-hidden="true"></span>
            <span class="contact-popup__text">
              <span class="contact-popup__label">Email</span>
              <span class="contact-popup__hint" data-social-hint></span>
            </span>
          </a>
        </div>
      </div>
      <span class="pagefoot__copyright">© 2026</span>
    </div>
  </footer>

  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="card__bar card__bar--tint">
      <h2 class="card__title" id="sheetTitle"></h2>
      <button class="sheet__close" id="sheetClose" aria-label="Close case study">✕</button>
    </div>
    <div class="sheet__body">
      <div class="sheet__intro">
        <div class="sheet__kicker" id="sheetKicker"></div>
        <h3 class="sheet__headline" id="sheetHeadline"></h3>
      </div>
      <div class="sheet__meta" id="sheetMeta"></div>
      <div id="sheetSections"></div>
    </div>
  </div>

</div>
</div>

<script src="js/experience-data.js"></script>
<script src="js/social-data.js"></script>
<script src="js/case-studies-data.js"></script>
<script src="js/home-content-data.js"></script>
<script src="js/gallery-render.js"></script>
<script src="js/case-sheet.js"></script>
<script src="js/main.js"></script>
<script src="js/social-render.js"></script>
<script src="js/contact-popup.js"></script>
<script src="js/background-music.js"></script>
</body>
</html>
