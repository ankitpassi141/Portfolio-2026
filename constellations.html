<body>

<canvas id="scene" aria-label="Interactive 3D space scene. V2: fly a small spacecraft with the arrow keys (or the on-screen pad), hold Shift to boost, and fly through the green particle tube to go faster; hitting any other shape resets your speed. Auto-cruise follows the course by itself; steer left or right to leave it, and it rejoins the course after 3 seconds hands-off. V1: a particle field you shape with clicks and a black-hole cursor."></canvas>

<canvas class="meteors" id="meteors" aria-hidden="true"></canvas>

<a class="cback" href="experiments.html">← Experiments</a>

<!-- bottom-left (top-left on narrow screens): version switch -->
<div class="corner">
  <div class="seg" role="group" aria-label="Constellations version">
    <button type="button" data-version="1">V1</button>
    <button type="button" data-version="2">V2</button>
  </div>
</div>

<!-- ======================= V1: the original particle field ======================= -->
<div class="bh v1-only" id="bh" aria-hidden="true"><div class="bh-reach"></div><div class="bh-core"></div></div>

<div class="controls v1-only" id="controls">
  <label class="ctl" for="speed">
    <span class="ctl-head"><span>Rotation speed</span><output id="speedOut" for="speed">0.3×</output></span>
    <input type="range" id="speed" min="0" max="3" step="0.05" value="0.3">
  </label>
  <label class="ctl" for="radius">
    <span class="ctl-head"><span>Cursor radius</span><output id="radiusOut" for="radius">150px</output></span>
    <input type="range" id="radius" min="0" max="240" step="5" value="150">
  </label>
</div>

<!-- ======================= V2: the spacecraft ======================= -->
<button type="button" class="sound v2-only" id="sound" aria-pressed="true" aria-label="Sound">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path class="sound-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path class="sound-off" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
</button>

<!-- speed as a rolling digital odometer (bottom-right on desktop, top-right on phones) -->
<div class="odo v2-only" id="odo">
  <div class="odo-digits" id="odoDigits" aria-hidden="true"></div>
  <span class="odo-unit" aria-hidden="true">km/h</span>
  <span class="sr-only" id="odoText">Speed 0 km/h</span>
</div>

<!-- flight mode: Manual = arrow keys / pad; Auto-cruise = follows the (hidden) course by itself, ramping up to max speed; ←/→ steer off it (it rejoins after 3s hands-off), ↑/↓ switch back to Manual -->
<div class="mode v2-only" role="group" aria-label="Flight mode">
  <button type="button" data-mode="auto" aria-pressed="false">Auto-cruise</button>
  <button type="button" data-mode="manual" aria-pressed="true" class="on">Manual</button>
</div>

<!-- desktop: shown until the first key press -->
<div class="hint v2-only" id="hint" aria-hidden="true"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd><span>to fly</span><kbd class="wide">shift</kbd><span>boost</span></div>

<!-- touch screens: hold to fly, same as the arrow keys; ⇧ = boost -->
<div class="pad v2-only" id="pad" role="group" aria-label="Flight controls">
  <button type="button" class="pad-up" data-key="up" aria-label="Thrust">↑</button>
  <button type="button" class="pad-left" data-key="left" aria-label="Turn left">←</button>
  <button type="button" class="pad-down" data-key="down" aria-label="Brake">↓</button>
  <button type="button" class="pad-right" data-key="right" aria-label="Turn right">→</button>
  <button type="button" class="pad-boost" data-key="boost" aria-label="Boost">⇧</button>
</div>

<div class="fallback" id="fallback">
  <div><strong>WebGL isn't available here.</strong><br>Constellations needs it to render the particle field &mdash; try a different browser or device.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/constellations.js?v=20260930"></script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
