<body>

<canvas id="scene" aria-label="Interactive 3D space scene. V1: a particle field — click to gather nearby particles into a shape, click again to release them, right-drag to orbit, scroll to zoom; the cursor is a black hole that swallows particles. V2: fly a small spacecraft anywhere in 3D — it always flies forward, the arrow keys turn and climb or dive (on touch screens, tilt the phone, or tap on the left or right of the screen to turn), Space brakes, hold Shift or Boost to boost; press Challenge to show a particle wormhole and fly through it, with a counter for how far you stay inside it and your best run saved."></canvas>

<canvas class="meteors" id="meteors" aria-hidden="true"></canvas>

<a class="cback" href="experiments.html" aria-label="Back to Experiments"><span class="v1-only">← Experiments</span><span class="v2-only" aria-hidden="true">←</span></a>

<!-- bottom-left (top-left on narrow screens): version switch -->
<div class="corner">
  <div class="seg" role="group" aria-label="Constellations version">
    <button type="button" data-version="1">V1</button>
    <button type="button" data-version="2">V2</button>
  </div>
</div>

<!-- ======================= V1: the original particle field ======================= -->
<div class="bh v1-only" id="bh" aria-hidden="true"><div class="bh-reach"></div><div class="bh-core"></div></div>

<div class="controls v1-only" id="controls">
  <label class="ctl" for="speed">
    <span class="ctl-head"><span>Rotation speed</span><output id="speedOut" for="speed">0.3×</output></span>
    <input type="range" id="speed" min="0" max="3" step="0.05" value="0.3">
  </label>
  <label class="ctl" for="radius">
    <span class="ctl-head"><span>Cursor radius</span><output id="radiusOut" for="radius">150px</output></span>
    <input type="range" id="radius" min="0" max="240" step="5" value="150">
  </label>
</div>

<!-- ======================= V2: the spacecraft ======================= -->
<button type="button" class="sound v2-only" id="sound" aria-pressed="true" aria-label="Sound">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path class="sound-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path class="sound-off" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
</button>

<!-- speed as a rolling digital odometer (top centre) -->
<div class="odo v2-only" id="odo">
  <div class="odo-digits" id="odoDigits" aria-hidden="true"></div>
  <span class="odo-unit" aria-hidden="true">km/h</span>
  <span class="sr-only" id="odoText">Speed 0 km/h</span>
</div>

<!-- Challenge only: metres flown inside the tube without leaving it, and the best run (saved) -->
<div class="run v2-only" id="run" aria-live="off">
  <span class="run-now"><span class="run-label">In tube</span> <b id="runNow">0</b> m</span>
  <span class="run-best"><span class="run-label">Best</span> <b id="runBest">0</b> m</span>
</div>

<!-- bottom centre: Challenge?, with Brake and Boost either side (touch screens only, hold). Cruising (default): the tube is hidden, the speed ramps up with no limit, and on desktop the autopilot follows the course whenever you are not steering (arrows / tilt / taps take over; it rejoins after 3s hands-off). Challenge: the tube shows and you fly it yourself; threading waypoints speeds you up (no limit), a hit resets the speed, and the distance counter measures how far you stay inside the tube. On phones in landscape: Brake bottom-left, Boost bottom-right, Challenge? middle of the right edge. -->
<div class="flightbar v2-only">
  <button type="button" class="hold brake" id="brakeBtn" data-key="brake" aria-label="Brake (hold)">Brake</button>
  <button type="button" class="challenge" id="challengeBtn" aria-pressed="false">Challenge?</button>
  <button type="button" class="hold boost" id="boostBtn" data-key="boost" aria-label="Boost (hold)">Boost</button>
</div>

<!-- desktop: shown until the first key press; touch screens: shown until the first steer -->
<div class="hint v2-only" id="hint" aria-hidden="true"><span class="hint-keys"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd><span>to steer</span><kbd class="wide">space</kbd><span>brake</span><kbd class="wide">shift</kbd><span>boost</span></span><span class="hint-touch">Tilt to steer · tap left / right to turn</span></div>

<div class="fallback" id="fallback">
  <div><strong>WebGL isn't available here.</strong><br>Constellations needs it to render the particle field &mdash; try a different browser or device.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/constellations.js?v=20261012"></script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
