<body>

<canvas id="scene" tabindex="0" aria-label="Driving scene. The car drives itself; W A S D or arrow keys take over, Space boosts, Ctrl brakes, M switches between auto-drive and manual, R puts the car back on the road, H hides the controls."></canvas>

<!-- liquid-glass refraction filters are built into this at runtime (Chromium only; elsewhere the glass is a plain blur) -->
<svg class="lg-defs" aria-hidden="true" focusable="false"><defs id="lgDefs"></defs></svg>

<a class="glass pill round xp" href="experiments.html" aria-label="Back to Experiments">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<!-- top-right: hide the UI · music · scene sound -->
<div class="topright">
  <button type="button" class="glass pill round" id="hideUi" aria-pressed="false" aria-label="Hide the controls (H)">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g class="eye-slash"><path d="M9.9 5.7A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.3 6.6C3.9 8.3 2.5 12 2.5 12S6 18.5 12 18.5a9.2 9.2 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></g>
      <g class="eye-open"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g>
    </svg>
  </button>
  <button type="button" class="glass pill round" id="music" aria-pressed="false" aria-label="Music">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path class="off-line" d="M3 3l18 18"/></svg>
  </button>
  <button type="button" class="glass pill round sound" id="sound" aria-pressed="true" aria-label="Sound">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z" class="fill"/>
      <path class="sound-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/>
      <path class="sound-off" d="M16 9l6 6M22 9l-6 6"/>
    </svg>
  </button>
</div>

<!-- bottom bar: time of day · HUD (distance · speed · drive mode) · weather -->
<div class="bar">
<button type="button" class="glass tg tg-time" id="todBtn">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
  <span class="tg-text"><span class="tg-label">Time</span><span class="tg-val">Auto</span></span>
</button>

<div class="hud glass" id="hud">
  <div class="hud-side hud-dist">
    <span class="hud-label">Distance</span>
    <span class="hud-val" id="odo">0.0</span>
    <span class="hud-unit">km</span>
  </div>

  <div class="hud-speed">
    <!-- left arc fills with speed (0–220 km/h), right arc lights while boosting -->
    <svg class="arcs" viewBox="0 0 240 120" aria-hidden="true">
      <path class="arc-track" d="M62 104 A80 80 0 0 1 62 16"/>
      <path class="arc-fill" id="arcSpeed" pathLength="100" d="M62 104 A80 80 0 0 1 62 16"/>
      <path class="arc-track" d="M178 104 A80 80 0 0 0 178 16"/>
      <path class="arc-fill boost" id="arcBoost" pathLength="100" d="M178 104 A80 80 0 0 0 178 16"/>
    </svg>
    <span class="speed" id="spd">0</span>
    <span class="hud-unit">km/h</span>
  </div>

  <button type="button" class="hud-side mode is-auto" id="mode" aria-pressed="true" aria-label="Auto-drive on. Click, press M, or press up or down while focused to switch.">
    <span class="wheel" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/><path d="M3.6 10.5h6.3M14.1 10.5h6.3M12 14.2v6.3"/></svg>
    </span>
    <span class="hud-val mode-val" id="modeVal">Auto</span>
    <span class="hud-unit">Drive · M</span>
  </button>
</div>

<button type="button" class="glass tg tg-wx" id="wxBtn">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.4A3.3 3.3 0 0 0 7 18z"/></svg>
  <span class="tg-text"><span class="tg-label">Weather</span><span class="tg-val">Auto</span></span>
</button>
</div>

<!-- shown until the first drive key -->
<div class="hint" id="hint" aria-hidden="true">Auto-drive is on · WASD / arrows take over · Space boost · Ctrl brake · M auto / manual · H hide controls</div>

<div class="toast" id="toast" role="status" style="opacity:0"></div>

<!-- touch screens only: steer from the middle of each edge, brake + boost just above the HUD
     (the car always drives itself here; these nudge it) -->
<div class="pad left"><button id="tl" aria-label="Steer left">◀</button></div>
<div class="pad right"><button id="tr" aria-label="Steer right">▶</button></div>
<div class="pad actions">
  <button id="tb" class="txt">Brake</button>
  <button id="tx" class="txt">Boost</button>
</div>

<div id="loading">Laying the road…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.js"></script>
<script src="js/valley-drive.js?v=20260929d"></script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
