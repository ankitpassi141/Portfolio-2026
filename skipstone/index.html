<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skipstone</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c1519">
<link rel="icon" type="image/png" href="/images/favicon/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-4hMhsbcX.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CqgndYVP.css">
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="Stone skipping scene. Touch the stone and pull down to throw."></canvas>
  <canvas id="fx"></canvas>

  <!-- in-game HUD -->
  <div class="hud" id="top" hidden>
    <button type="button" class="icon glass" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="2.6" height="10" rx="1"/><rect x="9.4" y="3" width="2.6" height="10" rx="1"/></svg>
    </button>
    <div class="goal glass" id="goal"></div>
    <button type="button" class="icon glass" id="soundBtn" aria-label="Sound off" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.5l3-2.5v9L5 10H2.5z"/><path id="sndWave" d="M10.5 5.5c1 .8 1 4.2 0 5M12.5 4c2 1.6 2 6.4 0 8" opacity="0.25"/></svg>
    </button>
  </div>

  <div class="hud glass" id="tilt" aria-live="polite" hidden>
    <span class="lab">Stone tilt</span>
    <span class="val" id="tiltVal">14°</span>
    <div class="band" id="band" hidden><i id="bandZone"></i><b id="bandNeedle"></b></div>
    <span class="src" id="tiltSrc">Drag up or down to tilt</span>
  </div>

  <div class="hud" id="count" hidden><div class="glass cnt"><span id="countN">0</span><small id="countLab">skips</small></div></div>
  <div class="hud glass" id="hint" hidden></div>
  <div class="hud glass" id="coach" hidden>
    <p class="step" id="coachStep"></p>
    <p class="txt" id="coachTxt"></p>
    <button type="button" class="link" id="coachSkip">Skip training</button>
  </div>
  <div class="hud glass" id="banner" hidden></div>

  <div class="hud glass" id="card" hidden>
    <div class="row"><span class="big" id="rSkips">0</span><span class="unit" id="rUnit">skips</span><span class="stat" id="rDist">0 m</span><span class="stat" id="rSpeed">0 m/s</span></div>
    <p id="rWhy"></p>
    <p class="extra" id="rExtra" hidden></p>
    <div class="acts"><button type="button" class="btn" id="cardMain">Throw again</button><button type="button" class="btn ghost" id="cardAlt" hidden>Map</button></div>
  </div>

  <div class="hud glass" id="err" hidden></div>

  <!-- screens -->
  <div class="screen" id="home">
    <div class="home-in">
      <p class="kicker">A stone, a still lake</p>
      <h1>Skipstone</h1>
      <p class="sub">Tilt the stone flat, pull back, let go. Count the skips.</p>
      <div class="home-acts">
        <button type="button" class="btn play" id="journeyBtn">Start</button>
        <button type="button" class="btn ghost" id="practiceBtn" hidden>Practice</button>
      </div>
      <p class="note" id="homeNote">On a phone, tilting it angles the stone.</p>
    </div>
  </div>

  <div class="screen sheet" id="map" hidden>
    <div class="sheet-in">
      <div class="sheet-head"><button type="button" class="icon glass" id="mapBack" aria-label="Back"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button><h2>Journey</h2><span class="stars-total" id="starsTotal"></span></div>
      <ol class="chapters" id="chapters"></ol>
    </div>
  </div>

  <div class="screen sheet" id="intro" hidden>
    <div class="sheet-in card-in">
      <p class="kicker" id="introKicker"></p>
      <h2 id="introTitle"></h2>
      <p class="sub" id="introGoal"></p>
      <ul class="stars-goal" id="introStars"></ul>
      <div class="stones" id="introStones" hidden></div>
      <div class="acts"><button type="button" class="btn" id="introGo">Start</button><button type="button" class="btn ghost" id="introBack">Back</button></div>
    </div>
  </div>

  <div class="screen sheet" id="pause" hidden>
    <div class="sheet-in card-in">
      <h2>Paused</h2>
      <div class="acts col">
        <button type="button" class="btn" id="resumeBtn">Resume</button>
        <button type="button" class="btn ghost" id="pauseSound">Sound: off</button>
        <button type="button" class="btn ghost" id="quitBtn">Quit to journey</button>
      </div>
    </div>
  </div>

  <div class="hud" id="fps" hidden></div>
</div>
</body>
</html>
