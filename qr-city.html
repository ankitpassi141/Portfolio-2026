* { box-sizing: border-box; }
body {
  background: var(--base); color: var(--ink); font-family: var(--font-body); font-size: 19px; line-height: 1.35;
  padding-inline: 16px; padding-block: 18px 30px; min-height: 100%;
}
.blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blobs i { position: absolute; display: block; border-radius: 50%; filter: blur(46px); opacity: 0.92; animation: drift 28s ease-in-out infinite alternate; }
.blobs i:nth-child(1) { width: 52vmax; height: 52vmax; left: -14vmax; top: -16vmax; background: var(--b1); }
.blobs i:nth-child(2) { width: 44vmax; height: 44vmax; right: -12vmax; top: -8vmax; background: var(--b2); animation-delay: -6s; }
.blobs i:nth-child(3) { width: 48vmax; height: 48vmax; left: -10vmax; bottom: -22vmax; background: var(--b3); animation-delay: -12s; }
.blobs i:nth-child(4) { width: 40vmax; height: 40vmax; right: -8vmax; bottom: -14vmax; background: var(--b4); animation-delay: -18s; }
.blobs i:nth-child(5) { width: 26vmax; height: 26vmax; left: 42%; top: 38%; background: var(--b5); opacity: 0.7; animation-delay: -9s; }
@keyframes drift { to { transform: translate(3vmax, 2vmax) scale(1.07); } }
@media (prefers-reduced-motion: reduce) { .blobs i { animation: none; } }

.col { position: relative; z-index: 1; width: min(100%, 880px, max(300px, calc(100vh - 200px))); margin-inline: auto; display: grid; gap: 16px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--font-hand); font-weight: 700; font-size: 54px; line-height: 0.95; letter-spacing: 0.5px; }
h1 span { display: inline-block; padding-bottom: 0.16em; background: var(--squiggle) 0 100% / 100% 0.2em no-repeat; }
.sub { color: var(--muted); font-size: 18px; transform: rotate(-1.5deg); }

.sheet { position: relative; isolation: isolate; }
.sheet::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 4px;
  background-color: var(--paper); background-image: var(--grain);
  filter: url(#deckle) drop-shadow(0 10px 12px var(--shadow));
}
.field { display: flex; gap: 12px; align-items: center; min-width: 0; }
input[type="text"] {
  flex: 1; min-width: 0; height: 54px; padding: 0 18px; font-family: var(--font-body); font-size: 21px; color: var(--ink);
  background-color: var(--paper); background-image: var(--grain);
  border: 2.5px solid var(--ink); border-radius: 22px 7px 20px 9px / 9px 20px 7px 22px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08), 0 10px 14px -8px var(--shadow); transform: rotate(-0.4deg);
}
input[type="text"]::placeholder { color: var(--muted); }
.stamp {
  flex: none; width: 54px; height: 54px; display: grid; place-items: center; text-decoration: none; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border: 2.5px solid var(--ink);
  border-radius: 9px 20px 8px 22px / 21px 8px 20px 9px; transform: rotate(2deg);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12), 0 10px 14px -8px var(--shadow); transition: transform 0.15s;
}
.stamp:hover { transform: rotate(-2deg) translateY(-2px); }
.stamp:active { transform: rotate(0deg) translateY(1px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12); }
.stamp[aria-disabled="true"] { background: var(--paper); color: var(--muted); border-style: dashed; pointer-events: none; }
.stamp svg { width: 26px; height: 26px; display: block; }
input:focus-visible, .stamp:focus-visible { outline: 3px dashed var(--accent); outline-offset: 4px; }
.err { margin: -6px 0 0 6px; color: var(--bad); font-size: 18px; transform: rotate(-0.6deg); }
.err:empty { display: none; }

.stage { aspect-ratio: 1; width: 100%; }
.stage::before { background-color: var(--paper-stage); }
#gl { position: absolute; inset: 14px; width: calc(100% - 28px); height: calc(100% - 28px); display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.tape {
  position: absolute; z-index: 3; width: 104px; height: 30px; pointer-events: none; opacity: 0.88;
  background: repeating-linear-gradient(135deg, var(--tape1) 0 9px, color-mix(in srgb, var(--tape1) 62%, white) 9px 18px);
  clip-path: polygon(0 0, 100% 0, 98% 25%, 100% 50%, 98% 75%, 100% 100%, 0 100%, 2% 75%, 0 50%, 2% 25%);
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.18));
}
.tape.a { left: -26px; top: 12px; transform: rotate(-38deg); }
.tape.b { right: -26px; bottom: 12px; transform: rotate(-38deg); background: repeating-linear-gradient(135deg, var(--tape2) 0 9px, color-mix(in srgb, var(--tape2) 62%, white) 9px 18px); }
.note {
  position: absolute; z-index: 3; left: 26px; bottom: 26px; max-width: calc(100% - 52px); padding: 8px 14px 10px;
  background: var(--note); color: var(--note-ink); font-size: 18px; transform: rotate(-2.5deg); pointer-events: none;
  box-shadow: 0 8px 10px -6px rgba(0, 0, 0, 0.35); border-radius: 2px 2px 14px 2px;
}

#soundBtn[aria-pressed="true"] .off, #soundBtn[aria-pressed="false"] .on { display: none; }
.stamp.alt { background: var(--paper); color: var(--ink); transform: rotate(-2deg); font-family: var(--font-hand); font-weight: 700; font-size: 22px; line-height: 1; }
.embedbox { padding: 18px 18px 16px; display: grid; gap: 10px; }
.embedbox[hidden] { display: none; }
.embedbox p { margin: 0; color: var(--muted); font-size: 18px; }
.embedbox textarea {
  width: 100%; min-height: 96px; resize: vertical; padding: 10px 14px; font: 15px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink);
  background-color: var(--paper); background-image: var(--grain); border: 2.5px solid var(--ink); border-radius: 14px 6px 12px 8px / 8px 12px 6px 14px;
}
.embedbox .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.btn { font-family: var(--font-body); font-size: 20px; height: 44px; padding: 0 20px; cursor: pointer; color: var(--accent-ink); background: var(--accent); border: 2.5px solid var(--ink); border-radius: 9px 18px 8px 16px / 16px 8px 18px 9px; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
.btn:active { transform: translateY(1px); }
html.embed body { padding: 0; background: transparent; min-height: 0; }
html.embed .blobs, html.embed header, html.embed .field, html.embed .err, html.embed .embedbox { display: none; }
html.embed .col { width: 100vw; max-width: none; height: 100vh; gap: 0; }
html.embed .stage { aspect-ratio: auto; height: 100vh; width: 100vw; }
html.embed .tape { display: none; }
</style>

/* QR core: byte-mode encoder (ECC level M, versions 1-14, selectable mask) + road-network analysis.

(function (root) {
  'use strict';

  var ECC_PER_BLOCK_M = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24];
  var BLOCKS_M = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9];
  var MAX_VER = 14;

  function getBit(x, i) { return ((x >>> i) & 1) !== 0; }

  function numRawModules(ver) {
    var r = (16 * ver + 128) * ver + 64;

    var prevR = model ? sphericalOf(persp).r / fitDistance() : 1;
    try { model = computeModel(url); }
    catch (e) { $('#err').textContent = e.message === 'Too long' ? 'That address is too long. Shorten it.' : 'Could not encode that address.'; return false; }
    $('#err').textContent = ''; state.url = url;
    buildCity(); resize();
    var sph = sphericalOf(persp);
    if (!snap) { setPersp(fitDistance() * clamp(prevR, 0.35, 1.5), sph.phi, sph.theta); controls.update(); }
    syncLink(url); if (!$('#embedBox').hidden) refreshEmbed();
    return true;
  }
  var typing = null;
  $('#url').addEventListener('input', function (e) {
    clearTimeout(typing);
    typing = setTimeout(function () {
      var u = normalize(e.target.value);
      if (!u) { $('#err').textContent = 'Enter a web address.'; return; }
      load(u);
    }, 250);
  });

  /* ---------- embed ---------- */
  if (EMBED) {
    document.documentElement.classList.add('embed');
    // the host page keeps its scroll wheel until the visitor clicks the city
    controls.enableZoom = false;
    canvas.addEventListener('pointerdown', function () { controls.enableZoom = true; });
    canvas.addEventListener('pointerleave', function () { controls.enableZoom = false; });
  }
  $('#url').value = state.url;
  function embedSnippet() {
    var base = location.protocol.indexOf('http') === 0 && !/claude\.(ai|com)$/.test(location.hostname) ? location.origin + location.pathname : 'https://YOUR-SITE/qr-city.html';
    var src = base + '?embed=1&url=' + encodeURIComponent(state.url);
    return { src: src, hosted: base.indexOf('YOUR-SITE') < 0, html: '<iframe src="' + src + '" title="QR City" width="480" height="480" style="border:0;max-width:100%;aspect-ratio:1" loading="lazy" allowfullscreen></iframe>' };
  }
  function refreshEmbed() {
    var s = embedSnippet(); $('#embedCode').value = s.html;
    $('#embedNote').textContent = s.hosted ? '' : 'Upload this page to your own site and swap in its address.';
  }
  $('#embedBtn').addEventListener('click', function () {
    var box = $('#embedBox'), open = box.hidden;
    box.hidden = !open; $('#embedBtn').setAttribute('aria-expanded', String(open)); if (open) refreshEmbed();
  });
  $('#copyEmbed').addEventListener('click', function () {
    var ta = $('#embedCode'); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    if (navigator.clipboard) { try { navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {} }
    $('#copyEmbed').textContent = ok ? 'Copied' : 'Press Ctrl+C'; setTimeout(function () { $('#copyEmbed').textContent = 'Copy code'; }, 1600);
  });

  /* ---------- boot ---------- */
  if (window.__QC_TEST) window.__QC_TEST.api = { cars: function () { return cars; }, persp: persp, controls: controls, built: function () { return built; }, fit: fitDistance, puffs: puffs, scene: scene, setHour: applyTime, night: function () { return nightLevel; }, dust: dust, flies: flies, exits: function () { return exits; } };
  model = computeModel(state.url);
  persp.aspect = (canvas.clientWidth || stageEl.clientWidth || 1) / (canvas.clientHeight || stageEl.clientHeight || 1); persp.updateProjectionMatrix();
  setPersp(fitDistance(), 0.0002, 0);
  buildCity(); resize(); setLimits(); syncLink(state.url);
  requestAnimationFrame(frame);
})();
</script>
