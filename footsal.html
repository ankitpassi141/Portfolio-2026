<body>

<canvas id="gl" aria-label="FootSal stadium. Drag players, tap to plan passes, tap the goal to shoot."></canvas>
<div id="fail" hidden>This browser could not start WebGL, so the stadium cannot be drawn.</div>

<a class="back" href="experiments.html" aria-label="Back to Experiments">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div id="hud" hidden>
  <div class="band top"><div class="wrap">
    <!-- broadcast scoreboard: team 0 name | team 0 score | game mode | team 1 score | team 1 name -->
    <div class="sb-row">
      <span class="sb-n left" id="n0"></span>
      <div class="sb" role="group" aria-label="Score">
        <div class="sb-team t0"><b class="sb-score" id="s0">0</b></div>
        <div class="sb-mid"><span id="sbMode">VS CPU</span><small>FIRST TO 3</small></div>
        <div class="sb-team t1"><b class="sb-score" id="s1">0</b></div>
      </div>
      <span class="sb-n right" id="n1"></span>
    </div>
    <div class="banner">
      <div class="btext"><h1 id="title">FootSal</h1><p id="hint" aria-live="polite"></p></div>
      <button class="icon" id="pause" type="button" aria-label="Pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
      <div class="watch off" id="timer">
        <svg viewBox="0 0 64 72" aria-hidden="true">
          <rect class="sw-c" x="27" y="0" width="10" height="7" rx="2"/>
          <rect class="sw-c" x="30" y="6" width="4" height="5"/>
          <rect class="sw-c" x="50" y="10" width="8" height="5" rx="2" transform="rotate(40 54 12)"/>
          <circle class="sw-face" cx="32" cy="42" r="28"/>
          <path id="swW" class="sw-w"/>
          <g id="swTicks" class="sw-t"></g>
          <line id="swH" class="sw-h" x1="32" y1="42" x2="32" y2="19"/>
          <circle class="sw-c" cx="32" cy="42" r="3"/>
          <text id="secs" class="sw-n" x="32" y="59" text-anchor="middle">10</text>
        </svg>
        <span class="ph" id="phl">ATTACK</span>
      </div>
    </div>
  </div></div>
  <div class="band bot"><div class="wrap">
    <div id="meter" hidden>
      <div id="mlab">TAP IN THE YELLOW FOR A PERFECT SHOT</div>
      <div class="mbar"><i id="mzone"></i><b id="mneedle"></b></div>
      <div class="mends"><span>SOFT</span><span>HARD</span></div>
    </div>
    <div class="controls off" id="controls">
      <button class="ghost" id="undo" type="button">Undo</button>
      <button class="prime" id="go" type="button">Done</button>
    </div>
  </div></div>
</div>

<!-- goal replay: badge and Skip, over the live replay -->
<div id="replay" hidden><div class="rp-badge"><span class="rp-jp" lang="ja">リプレイ</span><b>REPLAY</b></div><button class="ghost rp-skip" id="rpSkip" type="button">Skip replay</button></div>
<div id="ov"></div>
<div id="cut" aria-live="assertive"></div>
<!-- defender order menu: drawn by js/footsal.js, positioned on the projected defender each frame; it never
     takes pointer events itself (the canvas hit-tests it geometrically) -->
<div id="radial" hidden aria-live="polite"><div class="rd-fan"></div><div class="rd-cap"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="js/footsal-radial.js?v=20261024h"></script>
<script src="js/footsal.js?v=20261024h"></script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
