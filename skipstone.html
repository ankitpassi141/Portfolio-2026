<style>
/* Layout concept: the sea is the whole screen; a few frosted labels float at the edges like a camera HUD, nothing covers the throw line. */
:root {
  --ink: #f4f7f6;
  --ink-dim: rgba(244, 247, 246, 0.72);
  --glass: rgba(14, 28, 34, 0.38);
  --glass-edge: rgba(255, 255, 255, 0.18);
  --warm: #ffcf8a;
  --good: #9fe3b8;
  --bad: #ffa48f;
  --ground: #0c1519;
  --ui: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--ui); overflow: hidden; -webkit-user-select: none; user-select: none; }
#stage { position: fixed; inset: 0; }
#gl, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#fx { pointer-events: none; }
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.glass { background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); border-radius: 999px; }
#top { top: calc(10px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; gap: 2px; }
.seg button { font: 600 0.82rem/1 var(--ui); letter-spacing: 0.01em; color: var(--ink-dim); background: transparent; border: 0; border-radius: 999px; padding: 8px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.9); color: #13232a; }
.seg button:focus-visible, .btn:focus-visible, .icon:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
.right { display: inline-flex; gap: 8px; align-items: center; }
.best { font: 500 0.8rem/1 var(--num); padding: 9px 12px; color: var(--ink-dim); }
.best b { color: var(--ink); font-weight: 500; }
.icon { width: 34px; height: 34px; display: grid; place-items: center; color: var(--ink); cursor: pointer; padding: 0; }
.icon svg { width: 16px; height: 16px; }
#tilt { left: max(16px, env(safe-area-inset-left, 0px)); top: calc(112px + env(safe-area-inset-top, 0px)); display: grid; gap: 6px; justify-items: start; border-radius: 14px; padding: 10px 12px; }
#tilt .lab { font: 600 0.68rem/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4); }
#tilt .val { font: 500 1.9rem/1 var(--num); text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45); font-variant-numeric: tabular-nums; }
#tilt .src { font: 500 0.7rem/1.2 var(--ui); color: var(--ink-dim); max-width: 9rem; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5); }
#count { top: calc(64px + env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
#count .cnt { border-radius: 18px; padding: 10px 22px 10px; text-align: center; font: 500 clamp(2.4rem, 11vw, 4rem)/1 var(--num); }
#count small { display: block; font: 600 0.72rem/1 var(--ui); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 8px; color: var(--ink-dim); }
#hint { left: 50%; transform: translateX(-50%); bottom: calc(34vh + env(safe-area-inset-bottom, 0px)); font: 500 0.85rem/1.3 var(--ui); padding: 10px 16px; text-align: center; width: max-content; max-width: calc(100% - 32px); }
#card { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 420px; border-radius: 18px; padding: 16px 18px; display: grid; gap: 10px; }
#card .row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
#card .big { font: 500 2.6rem/1 var(--num); }
#card .unit { font: 600 0.72rem/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
#card .stat { font: 500 0.9rem/1 var(--num); color: var(--ink-dim); }
#card p { margin: 0; font-size: 0.92rem; line-height: 1.4; }
#card p.good { color: var(--good); } #card p.bad { color: var(--bad); }
.btn { font: 700 0.95rem/1 var(--ui); background: var(--ink); color: #13232a; border: 0; border-radius: 999px; padding: 13px 18px; cursor: pointer; justify-self: start; }
#motionBtn { left: 50%; transform: translateX(-50%); bottom: calc(34vh + 56px + env(safe-area-inset-bottom, 0px)); }
#err { left: 16px; right: 16px; top: 40%; text-align: center; font-size: 0.95rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<body>
<div id="stage">
  <canvas id="gl" aria-label="Stone skipping scene. Drag on the stone and pull down to throw."></canvas>
  <canvas id="fx"></canvas>

  <div class="hud" id="top">
    <div class="seg glass" role="group" aria-label="Water">
      <button type="button" id="w-lake" data-water="lake" aria-pressed="true">Smooth</button>
      <button type="button" id="w-patchy" data-water="patchy" aria-pressed="false">Patchy</button>
      <button type="button" id="w-sea" data-water="sea" aria-pressed="false">Turbulent</button>
    </div>
    <div class="right">
      <div class="best glass">Best <b id="bestN">0</b></div>
      <button type="button" class="icon glass" id="soundBtn" aria-label="Sound off" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.5l3-2.5v9L5 10H2.5z"/><path id="sndWave" d="M10.5 5.5c1 .8 1 4.2 0 5M12.5 4c2 1.6 2 6.4 0 8" opacity="0.25"/></svg>
      </button>
    </div>
  </div>

  <div class="hud glass" id="tilt" aria-live="polite">
    <span class="lab">Stone tilt</span>
    <span class="val" id="tiltVal">14°</span>
    <span class="src" id="tiltSrc">Drag up or down to tilt</span>
  </div>

  <div class="hud" id="count" hidden><div class="glass cnt"><span id="countN">0</span><small>skips</small></div></div>

  <div class="hud glass" id="hint">Tilt the stone, then touch it and pull down to throw</div>

  <button type="button" class="hud btn" id="motionBtn" hidden>Aim by tilting your phone</button>

  <div class="hud glass" id="card" hidden>
    <div class="row"><span class="big" id="rSkips">0</span><span class="unit">skips</span><span class="stat" id="rDist">0 m</span><span class="stat" id="rSpeed">0 m/s</span></div>
    <p id="rWhy"></p>
    <button type="button" class="btn" id="againBtn">Throw again</button>
  </div>

  <div class="hud glass" id="err" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Stone skipping physics model (POC).
   Pure functions, no DOM. Works in Node (tests) and the browser (inlined).
   Units: metres, seconds, degrees for angles. Throw direction is +x. */
(function (root) {
  'use strict';
  const G = 9.81;
  const H0 = 0.6;            // release height above water (m)
  const D2R = Math.PI / 180;
  const R2D = 180 / Math.PI;

  // Four stones. alpha = ideal angle of attack (deg), win = half width of the
  // working window (deg), lift = how strongly water pushes it back up,
  // stab = how much spin steadies it, vmin = slowest speed that still planes,
  // vyMax = hardest vertical hit it survives.
  const STONES = {
    slate:  { id: 'slate',  name: 'Flat slate',   alpha: 18, win: 7.0, lift: 1.00, stab: 1.00, vmin: 5.0, vyMax: 6.5, vtop: 19, thick: 0.9 },
    oval:   { id: 'oval',   name: 'River oval',   alpha: 15, win: 6.0, lift: 0.88, stab: 0.85, vmin: 5.8, vyMax: 5.5, vtop: 17, thick: 1.4 },
    pebble: { id: 'pebble', name: 'Round pebble', alpha: 12, win: 5.5, lift: 0.75, stab: 1.20, vmin: 6.8, vyMax: 5.0, vtop: 20, thick: 2.2 },
    chunk:  { id: 'chunk',  name: 'Heavy chunk',  alpha: 22, win: 9.0, lift: 0.70, stab: 0.75, vmin: 5.5, vyMax: 7.5, vtop: 15, thick: 3.2 }
  };

  // Water bodies. winF scales the stone's window, loss is energy lost per skip,
  // amp is wave height scale (m), flow is the current strength (0 = none).
  const WATER = {
    lake:  { id: 'lake',  name: 'Calm lake',      loss: 0.080, winF: 0.70, amp: 0.010, flow: 0 },
    sea:   { id: 'sea',   name: 'Choppy sea',     loss: 0.115, winF: 1.00, amp: 0.085, flow: 0 },
    river: { id: 'river', name: 'River current',  loss: 0.115, winF: 1.00, amp: 0.030, flow: 1 },
    patchy: { id: 'patchy', name: 'Patchy',       loss: 0.100, winF: 0.90, amp: 0.070, flow: 0 }
  };

  const BIAS_PER_FLOW = 4.0;   // degrees of angle bias per unit of flow

  // Rain: calm lake behaves like a (weak) river, sea disturbance +25%,
  // river window 25% narrower.
  function effective(cond) {
    const w = WATER[cond.water];
    let e = { loss: w.loss, winF: w.winF, amp: w.amp, flow: 0, flowDir: 0, height: 0 };
    if (cond.water === 'river') { e.flow = cond.flowStr; e.flowDir = cond.flowDir; }
    if (cond.rain) {
      if (cond.water === 'lake') {
        const r = WATER.river;
        e = { loss: r.loss, winF: r.winF, amp: 0.020, flow: cond.flowStr, flowDir: cond.flowDir };
      } else if (cond.water === 'sea') {
        e.amp *= 1.25;
      } else if (cond.water === 'river') {
        e.winF *= 0.75;
      }
    }
    e.bias = e.flow * e.flowDir * BIAS_PER_FLOW;
    e.height = e.amp / 0.2;                 // renderer wave-height scale
    return e;
  }

  // Waves: the same 12-wave sum the renderer draws (ocean.js). They travel toward the thrower (-x).
  const WL = [90, 60, 41, 28, 19, 13, 9, 6.2, 4.3, 3.0, 2.1, 1.5];
  const WS = [0.0050, 0.0060, 0.0075, 0.0085, 0.0095, 0.0100, 0.0100, 0.0095, 0.0090, 0.0085, 0.0080, 0.0075];
  const WOFF = [0, -0.35, 0.4, -0.7, 0.8, -1.1, 1.2, -0.55, 0.95, -1.3, 0.65, -0.2];
  const HEAD = 1.5 * Math.PI;                 // wave heading 270 deg: toward -x
  const WK = WL.map(function (l) { return 2 * Math.PI / l; });
  const WC = WK.map(function (k) { return Math.sqrt(G / k); });
  const WDX = WOFF.map(function (o) { return Math.sin(HEAD + o); });
  function makeWaves(rand) { return { toff: rand() * 500 }; }
  // patchy water: calm and rough stretches. Same formula as the renderer (ocean.js patchM).
  function sstep(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
  function patchM(x, z) { const n = 0.6 * Math.sin(0.19 * x + 1.7 + 0.9 * Math.sin(0.11 * z)) + 0.4 * Math.sin(0.071 * x + 0.05 * z + 4.1); return 0.22 + 1.45 * sstep(-0.15, 0.25, n); }
  // surface height and slope along x at x (z = 0), water clock t, height scale H
  function waveHeight(waves, H, x, t) {
    const T = t + waves.toff;
    let h = 0;
    for (let i = 0; i < 12; i++) h += WL[i] * WS[i] * H * Math.sin(WK[i] * (WDX[i] * x - WC[i] * T) + i * 1.7);
    return waves.patch ? h * patchM(x, 0) : h;
  }
  function waveSlopeDeg(waves, H, x, t) {
    const T = t + waves.toff;
    let s = 0;
    for (let i = 0; i < 12; i++) s += WL[i] * WS[i] * H * WK[i] * WDX[i] * Math.cos(WK[i] * (WDX[i] * x - WC[i] * T) + i * 1.7);
    return Math.atan(waves.patch ? s * patchM(x, 0) : s) * R2D;
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  // th = { theta (deg, launch pitch), v (m/s), phi (deg, grip tilt), spin (0..1) }
  // t0 = water clock time at release (s).
  function simulate(cond, th, t0) {
    const st = STONES[cond.stone];
    const tf = cond.thick;
    const eff = effective(cond);
    const ideal = st.alpha + (tf - 1) * 8;
    const vmin = st.vmin * (0.9 + 0.1 * tf);
    let spin = th.spin;
    const v = th.v * (1 - 0.12 * spin);
    let vx = v * Math.cos(th.theta * D2R);
    let vy = v * Math.sin(th.theta * D2R);
    let x = 0, y = H0, t = 0;
    const surf = eff.amp > 0.015 ? function (xx, tt) { return waveHeight(cond.waves, eff.height, xx, t0 + tt); } : function () { return 0; };
    const segs = [];        // ballistic segments for animation
    const contacts = [];
    let skips = 0;
    let end = 'sank';

    for (let i = 0; i < 45; i++) {
      const fl = function (h) { return (vy + Math.sqrt(Math.max(0, vy * vy + 2 * G * (y - h)))) / G; };
      let dur = Math.max(0.02, fl(0)), hS = 0;
      for (let it = 0; it < 3; it++) { hS = surf(x + vx * dur, t + dur); dur = Math.max(0.02, fl(hS)); }
      hS = surf(x + vx * dur, t + dur);
      segs.push({ x0: x, y0: y, t0: t, vx: vx, vy: vy, dur: dur, spin: spin });
      x += vx * dur;
      t += dur;
      const vyi = vy - G * dur;                 // negative on descent
      const s = Math.hypot(vx, vyi);
      const gamma = Math.atan2(-vyi, vx) * R2D; // descent angle
      const S = clamp(spin * st.stab, 0, 1);
      const slope = eff.amp > 0.015 ? waveSlopeDeg(cond.waves, eff.height, x, t0 + t) : 0;
      const alpha = th.phi + gamma + eff.bias + slope * (1 - 0.9 * S);
      const fast = clamp(1 - 0.16 * (s - st.vtop), 0.2, 1);   // too fast = stone wobbles
      const win = st.win * eff.winF * (0.65 + 0.35 * S) * fast;
      const err = alpha - ideal;
      const c = { n: i + 1, x: x, y: hS, t: t, speed: s, gamma: gamma, alpha: alpha, err: err, win: win, ok: false, why: '' };

      if (s < vmin) c.why = 'slow';
      else if (-vyi > st.vyMax) c.why = 'hard';
      else if (err > win) c.why = 'steep';
      else if (err < -win) c.why = 'shallow';
      else c.ok = true;
      contacts.push(c);
      if (!c.ok) { end = c.why; break; }

      skips++;
      const q = Math.abs(err) / win;
      const loss = eff.loss * (1 + 0.8 * q * q) * (1 + 0.25 * spin);
      vx *= (1 - loss);
      const ar = clamp(alpha, 6, 30) * D2R;
      vy = Math.max(0.55, 0.42 * s * Math.sin(ar) * st.lift);
      y = hS;
      spin *= 0.88;
    }
    return { skips: skips, contacts: contacts, segs: segs, end: end, distance: x, duration: t, ideal: ideal, eff: eff };
  }

  // Position of the stone at sim time tt (for animation).
  function stateAt(sim, tt) {
    const segs = sim.segs;
    for (let i = 0; i < segs.length; i++) {
      const sg = segs[i];
      if (tt <= sg.t0 + sg.dur || i === segs.length - 1) {
        const u = clamp(tt - sg.t0, 0, sg.dur);
        return { x: sg.x0 + sg.vx * u, y: sg.y0 + sg.vy * u - 0.5 * G * u * u, seg: i, spin: sg.spin };
      }
    }
    return { x: 0, y: H0, seg: 0, spin: 0 };
  }

  // --- Random conditions -------------------------------------------------
  function mulberry(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeCondition(rand, force) {
    force = force || {};
    const stoneIds = Object.keys(STONES);
    const waterIds = Object.keys(WATER);
    const water = force.water || waterIds[Math.floor(rand() * waterIds.length)];
    const stone = force.stone || stoneIds[Math.floor(rand() * stoneIds.length)];
    const rain = force.rain !== undefined ? force.rain : rand() < 0.3;
    const strs = [0.6, 1.0, 1.4];
    return {
      stone: stone,
      thick: force.thick || (0.88 + rand() * 0.24),
      water: water,
      rain: rain,
      flowDir: rand() < 0.5 ? 1 : -1,        // +1 pushes the angle up (flow toward thrower)
      flowStr: strs[Math.floor(rand() * 3)],
      waves: makeWaves(rand)
    };
  }

  // --- Limits for the human controls ------------------------------------
  const LIMITS = { theta: [-10, 15], v: [7, 24], phi: [0, 30], spin: [0, 1] };

  root.Phys = {
    G: G, H0: H0, STONES: STONES, WATER: WATER, LIMITS: LIMITS, BIAS_PER_FLOW: BIAS_PER_FLOW,
    effective: effective, simulate: simulate, stateAt: stateAt, makeCondition: makeCondition,
    makeWaves: makeWaves, patchM: patchM, waveHeight: waveHeight, waveSlopeDeg: waveSlopeDeg,
    mulberry: mulberry, clamp: clamp
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.Phys;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
'use strict';
const $ = function (s) { return document.querySelector(s); };
if (!window.THREE) { const e = $('#err'); e.hidden = false; e.textContent = 'The 3D library did not load. Check your connection and reload.'; return; }
const P = window.Phys;
const D2R = Math.PI / 180;
const clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

/* ------------------------------------------------------------------ renderer, scene, camera */
const canvas = $('#gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { const el = $('#err'); el.hidden = false; el.textContent = 'This device could not start WebGL.'; return; }

renderer.setPixelRatio(pr);

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.02, 2600);

/* Ocean: ported from the Open Water scene (sky, FFT-free wave sum, shallow-water splash sim, caustics, spray, synthesised sound). */
const Ocean = (function () {
'use strict';
var small = Math.min(window.innerWidth, window.innerHeight) < 700;
var state = { height: 0.7, chop: 0.9, wind: 270, sun: 12, cover: 0.2, clarity: 0.75, caustics: 1.0, spray: 1.0, volume: 0.6 };
var SUN_AZ = 78 * Math.PI / 180;
var G9 = 9.81;
var toff = 0, rainOn = false, simAcc = 0, simT = 0;
var $ = function () { return null; };

var WL = [90, 60, 41, 28, 19, 13, 9, 6.2, 4.3, 3.0, 2.1, 1.5];                          /* wavelengths in metres */
var WS = [0.0050, 0.0060, 0.0075, 0.0085, 0.0095, 0.0100, 0.0100, 0.0095, 0.0090, 0.0085, 0.0080, 0.0075];  /* amplitude per metre of wavelength */
var WOFF = [0, -0.35, 0.4, -0.7, 0.8, -1.1, 1.2, -0.55, 0.95, -1.3, 0.65, -0.2];              /* directional spread, radians */

/* ---------- water simulation: linear shallow-water equations, staggered grid, CPU ---------- */
/* h_t = -div(q),  q_t = -c^2 grad(h + P)     h: surface elevation, q: volume flux, P: pressure head from floating hulls
   c^2 = g * 0.6 m: the wave speed (2.4 m/s) of ripples a few metres long, not the true speed of a long shallow-water wave */
var SIM_N = 192, SIM_SZ = 96, SIM_DX = SIM_SZ / SIM_N, SIM_C2 = 9.81 * 0.6, SIM_O = -SIM_SZ / 2;
var simH = new Float32Array(SIM_N * SIM_N), simQx = new Float32Array(SIM_N * SIM_N), simQz = new Float32Array(SIM_N * SIM_N);
var simF = new Float32Array(SIM_N * SIM_N), simP = new Float32Array(SIM_N * SIM_N), simSp = new Float32Array(SIM_N * SIM_N);
var simData = new Float32Array(SIM_N * SIM_N * 4);
var simTex = new THREE.DataTexture(simData, SIM_N, SIM_N, THREE.RGBAFormat, THREE.FloatType);
simTex.minFilter = simTex.magFilter = THREE.NearestFilter;
simTex.generateMipmaps = false; simTex.flipY = false; simTex.needsUpdate = true;
(function () {
  var N = SIM_N, W = 14, i, j;
  for (j = 0; j < N; j++) for (i = 0; i < N; i++) {
    var d = Math.min(i, j, N - 1 - i, N - 1 - j);
    simSp[j * N + i] = d < W ? Math.pow((W - d) / W, 2) * 6 : 0;   /* absorbing sponge so waves leave the basin instead of bouncing back */
  }
})();

function simStep(dt) {
  var N = SIM_N, c = SIM_C2 * dt / SIM_DX, r = dt / SIM_DX, i, j, k, m, keep = 1 - 0.35 * dt, fd = Math.exp(-0.45 * dt);
  for (j = 0; j < N; j++) {
    for (i = 0; i < N; i++) {
      k = j * N + i;
      m = keep - simSp[k] * dt;
      var hp = simH[k] + simP[k];
      simQx[k] = i < N - 1 ? (simQx[k] - c * (simH[k + 1] + simP[k + 1] - hp)) * m : 0;
      simQz[k] = j < N - 1 ? (simQz[k] - c * (simH[k + N] + simP[k + N] - hp)) * m : 0;
    }
  }
  for (j = 0; j < N; j++) {
    for (i = 0; i < N; i++) {
      k = j * N + i;
      var div = simQx[k] - (i > 0 ? simQx[k - 1] : 0) + simQz[k] - (j > 0 ? simQz[k - N] : 0);
      var h = (simH[k] - r * div) * (1 - (0.04 + simSp[k] * 0.5) * dt);
      simH[k] = (h > -3 && h < 3) ? h : 0;
      simF[k] *= fd;
    }

}

/* zero-volume pulse (a hump inside a wider dip), so a splash sends out rings and does not add water */
function simKick(x, z, amp, sig, foam) {
  var N = SIM_N, lim = SIM_SZ / 2 - 6;
  if (Math.abs(x) > lim || Math.abs(z) > lim) return false;
  var gi = (x - SIM_O) / SIM_DX - 0.5, gj = (z - SIM_O) / SIM_DX - 0.5, R = Math.ceil(sig * 4 / SIM_DX) + 1;
  var i0 = Math.max(1, Math.floor(gi) - R), i1 = Math.min(N - 2, Math.floor(gi) + R);
  var j0 = Math.max(1, Math.floor(gj) - R), j1 = Math.min(N - 2, Math.floor(gj) + R);
  var s2 = 2 * sig * sig;
  for (var j = j0; j <= j1; j++) for (var i = i0; i <= i1; i++) {
    var dx = (i + 0.5) * SIM_DX + SIM_O - x, dz = (j + 0.5) * SIM_DX + SIM_O - z, r2 = dx * dx + dz * dz, k = j * N + i;
    var g1 = Math.exp(-r2 / s2);
    simH[k] += amp * (g1 - 0.25 * Math.exp(-r2 / (4 * s2)));
    simF[k] = Math.min(1, simF[k] + foam * g1);
  }
  return true;
}

function simHAt(x, z) {
  var N = SIM_N, qx = (x - SIM_O) / SIM_SZ, qz = (z - SIM_O) / SIM_SZ;
  var ex = Math.min(qx, 1 - qx), ez = Math.min(qz, 1 - qz);
  if (ex <= 0 || ez <= 0) return 0;
  var ew = Math.min(ex / 0.06, 1), ev = Math.min(ez / 0.06, 1);
  ew = ew * ew * (3 - 2 * ew) * ev * ev * (3 - 2 * ev);
  var gx = qx * N - 0.5, gz = qz * N - 0.5, ix = Math.floor(gx), iz = Math.floor(gz), fx = gx - ix, fz = gz - iz;
  var x0 = Math.max(0, Math.min(N - 1, ix)), x1 = Math.max(0, Math.min(N - 1, ix + 1));
  var z0 = Math.max(0, Math.min(N - 1, iz)), z1 = Math.max(0, Math.min(N - 1, iz + 1));
  var a = simH[z0 * N + x0], b = simH[z0 * N + x1], c = simH[z1 * N + x0], d = simH[z1 * N + x1];
  return ((a + (b - a) * fx) * (1 - fz) + (c + (d - c) * fx) * fz) * ew;
}

/* pack height, slope and foam into the texture the shaders read */
function packSim() {
  var N = SIM_N, inv = 1 / (2 * SIM_DX), i, j, k, o;
  for (j = 0; j < N; j++) {
    for (i = 0; i < N; i++) {
      k = j * N + i; o = k * 4;
      var gx = (simH[i < N - 1 ? k + 1 : k] - simH[i > 0 ? k - 1 : k]) * inv;
      var gz = (simH[j < N - 1 ? k + N : k] - simH[j > 0 ? k - N : k]) * inv;
      var s = Math.sqrt(gx * gx + gz * gz) - 0.25;
      if (s > 0) { var fb = Math.min(1, s * 2.2); if (fb > simF[k]) simF[k] = fb; }
      simData[o] = simH[k]; simData[o + 1] = gx; simData[o + 2] = gz; simData[o + 3] = simF[k];
    }
  }
  simTex.needsUpdate = true;
}

function makeOceanGeometry(rings, segs, rmax) {
  var pos = new Float32Array((rings + 1) * segs * 3), idx = [], i, j, t, r, a;
  for (i = 0; i <= rings; i++) {
    t = i / rings; r = rmax * t * t;
    for (j = 0; j < segs; j++) {
      a = j / segs * Math.PI * 2;
      var o = (i * segs + j) * 3;
      pos[o] = Math.cos(a) * r; pos[o + 1] = 0; pos[o + 2] = Math.sin(a) * r;
    }
  }
  for (i = 0; i < rings; i++) {
    for (j = 0; j < segs; j++) {
      var j2 = (j + 1) % segs;
      var A = i * segs + j, B = i * segs + j2, C = (i + 1) * segs + j, D = (i + 1) * segs + j2;
      idx.push(A, B, C, B, D, C);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(idx), 1));
  return g;
}

/* ---------- parameters ---------- */
function applyWaves() {
  var a = state.wind * Math.PI / 180, sumA2 = 0, sumKA = 0, i;
  for (i = 0; i < WL.length; i++) {
    var ang = a + WOFF[i];
    var A = WL[i] * WS[i] * state.height;
    var k = 2 * Math.PI / WL[i];
    U.uWaves.value[i].set(Math.sin(ang), Math.cos(ang), A, k);
    sumA2 += A * A; sumKA += k * A;
  }
  var hs = 4 * Math.sqrt(sumA2 / 2);
  var chop = sumKA > 0 ? Math.min(state.chop, 1.2 / sumKA) : state.chop;
  U.uChop.value = chop;
  SU.uWind.value.set(Math.sin(a), Math.cos(a));
  U.uWindAng.value = a;
  U.uHs.value = Math.max(hs, 0.02);
  U.uFoamAmt.value = Math.max(0, Math.min(1, (hs - 0.7) / 1.8)) * (0.5 + 0.5 * Math.min(state.chop, 1));
}
function applySun() {
  var el = state.sun * Math.PI / 180;
  U.uSunDir.value.set(Math.cos(el) * Math.sin(SUN_AZ), Math.sin(el), -Math.cos(el) * Math.cos(SUN_AZ));
}

/* ---------- splashes ---------- */
var burstIdx = 0, ripIdx = 0;
function splash(x, z, k) {
  var tt = U.uTime.value;
  if (!simKick(x, z, -0.3 * k, 0.8, 0.9 * k)) {
    U.uRip.value[ripIdx].set(x, z, tt, 0.35 * k);
    ripIdx = (ripIdx + 1) % U.uRip.value.length;
  }
  SU.uBurst.value[burstIdx].set(x, z, tt, Math.max(0.3, Math.min(1, k)));
  burstIdx = (burstIdx + 1) % SU.uBurst.value.length;
}

var snd = { ctx: null, on: false, wanted: true, n: null, gust: 1, gustT: 1, gustClock: 0, lap: 0, gull: 18, thunder: 22 };

function makeNoise(ctx, seconds, type) {
  var sr = ctx.sampleRate, n = Math.floor(seconds * sr), f = Math.floor(0.6 * sr);
  var buf = ctx.createBuffer(2, n, sr);
  for (var ch = 0; ch < 2; ch++) {
    var raw = new Float32Array(n + f), i, v, w;
    var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
    for (i = 0; i < n + f; i++) {
      w = Math.random() * 2 - 1;
      if (type === 'white') v = w;
      else if (type === 'pink') {
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856; b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
        v = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
      } else { last = (last + 0.02 * w) / 1.02; v = last * 3.5; }
      raw[i] = v;
    }
    var out = buf.getChannelData(ch), sum = 0;
    for (i = 0; i < n; i++) out[i] = raw[i];
    for (i = 0; i < f; i++) { var a = i / f; out[i] = raw[i] * Math.sin(a * Math.PI / 2) + raw[n + i] * Math.cos(a * Math.PI / 2); }
    for (i = 0; i < n; i++) sum += out[i] * out[i];
    var g = 0.2 / Math.sqrt(sum / n + 1e-9);
    for (i = 0; i < n; i++) out[i] *= g;
  }
  return buf;
}

function makeImpulse(ctx, secs, decay) {
  var n = Math.floor(secs * ctx.sampleRate), b = ctx.createBuffer(2, n, ctx.sampleRate);
  for (var ch = 0; ch < 2; ch++) {
    var d = b.getChannelData(ch);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
  }
  return b;
}

/* height of the real wave field under the camera, same formula as the vertex shader */
function heaveAt(x, z, t) {
  var h = 0, W = U.uWaves.value;
  for (var i = 0; i < W.length; i++) {
    var w = W[i], k = w.w, c = Math.sqrt(9.81 / k);
    h += w.z * Math.sin(k * (w.x * x + w.y * z - c * t) + i * 1.7);
  }
  return h;
}

const stoneSeed = 41;
const maps = makeStoneMaps(stoneSeed);
const stoneMat = new THREE.MeshPhysicalMaterial({ map: maps.map, roughnessMap: maps.rough, normalMap: maps.nrm, normalScale: new THREE.Vector2(0.7, 0.7), roughness: 1, metalness: 0, clearcoat: 0.18, clearcoatRoughness: 0.55, envMapIntensity: 1.0 });
const stoneMesh = new THREE.Mesh(makeStoneGeometry(stoneSeed), stoneMat);
const stone = new THREE.Group(); stone.add(stoneMesh); scene.add(stone);

/* faint flight trail */
const TRAIL_MAX = 600, trailPos = new Float32Array(TRAIL_MAX * 3);
const trailGeo = new THREE.BufferGeometry(); trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3)); trailGeo.setDrawRange(0, 0);
const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.28, depthWrite: false }));
trail.frustumCulled = false; scene.add(trail);
let trailN = 0;

/* ------------------------------------------------------------------ first-person rig */
const EYE = new THREE.Vector3(-1.05, 1.16, 0);
const LOOK = new THREE.Vector3(30, -0.9, 0);
const HELD = new THREE.Vector3(-0.62, 0.955, 0);       // stone at the bottom centre of the view     // stone in front of the eye, a little low and right
camera.position.copy(EYE); camera.lookAt(LOOK);
const camPos = EYE.clone(), camLook = LOOK.clone();

/* ------------------------------------------------------------------ state */
const LIM = P.LIMITS;
const SPIN = 0.8, THETA = 2;                            // launch pitch is fixed: tilt is the angle that matters
const game = {
  water: 'lake', phase: 'aim', tilt: 14, tiltTarget: 14, pull: 0, best: 0, sound: false,
  cond: null, sim: null, t: 0, t0: 0, next: 0, count: 0, sunk: 0, doneAt: null, v: 0
};
try { game.best = parseInt(localStorage.getItem('skipstone-best') || '0', 10) || 0; } catch (e) { /* storage blocked */ }
$('#bestN').textContent = game.best;
let wt = 0, wtPrev = 0;

function makeCond(water) {
  return { stone: 'slate', thick: 1, water: water, rain: false, flowDir: 1, flowStr: 0, waves: { toff: Math.random() * 500, patch: water === 'patchy' } };
}
function applyWater(water) {
  game.water = water; game.cond = makeCond(water);
  const eff = P.effective(game.cond);
  Ocean.setCondition(game.cond, eff);
  const sd = Ocean.sunDir();
  sun.position.copy(sd).multiplyScalar(10); sun.color.copy(Ocean.sunColor());
  document.querySelectorAll('[data-water]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.water === water); });
}

/* ------------------------------------------------------------------ input: tilt (motion), drag-to-tilt fallback, pull to throw */
const motion = { on: false, seen: false, base: null, baseTilt: 14, raw: 0 };
function screenPitch(e) {
  const ang = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  if (ang === 90) return -e.gamma;
  if (ang === -90 || ang === 270) return e.gamma;
  return e.beta;
}
function onOrient(e) {
  if (e.beta == null) return;
  motion.seen = true; motion.raw = screenPitch(e);
  if (!motion.on) { motion.on = true; setTiltSource(); }
  if (game.phase !== 'aim') return;
  if (motion.base === null) { motion.base = motion.raw; motion.baseTilt = game.tiltTarget; }
  game.tiltTarget = clamp(motion.baseTilt + (motion.raw - motion.base) * 0.5, LIM.phi[0], LIM.phi[1]);
}
function listenMotion() { window.addEventListener('deviceorientation', onOrient); }
function setTiltSource() {
  $('#tiltSrc').textContent = motion.on ? 'Tilt your phone to angle the stone' : 'Drag up or down to tilt';
  $('#hint').textContent = motion.on ? 'Tilt to angle the stone, then touch it and pull down' : 'Drag up or down to tilt, then touch the stone and pull down';
}
const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
if (coarse && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
  const mb = $('#motionBtn'); mb.hidden = false;
  mb.onclick = function () {
    DeviceOrientationEvent.requestPermission().then(function (s) {
      mb.hidden = true;
      if (s === 'granted') { listenMotion(); setTimeout(function () { if (!motion.seen) $('#tiltSrc').textContent = 'Tilt is not available here. Drag up or down to tilt'; }, 1500); }
      else $('#tiltSrc').textContent = 'Motion access was declined. Drag up or down to tilt';
    }).catch(function () { mb.hidden = true; $('#tiltSrc').textContent = 'Tilt is not available here. Drag up or down to tilt'; });
  };
} else if (coarse && 'ondeviceorientation' in window) { listenMotion(); }
setTiltSource();

const v3 = new THREE.Vector3();
function stoneScreen() {
  v3.copy(stone.position).project(camera);
  const r = canvas.getBoundingClientRect();
  return { x: (v3.x * 0.5 + 0.5) * r.width, y: (-v3.y * 0.5 + 0.5) * r.height, r: r };
}
let drag = null, motionBtnShown = false;
canvas.addEventListener('pointerdown', function (e) {
  startAudio();
  if (game.phase !== 'aim') return;
  const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, s = stoneScreen();
  const hitR = Math.max(64, Math.min(r.width, r.height) * 0.16);
  canvas.setPointerCapture(e.pointerId);
  if (Math.hypot(x - s.x, y - s.y) < hitR) drag = { kind: 'pull', x0: x, y0: y, id: e.pointerId, h: r.height };
  else if (!motion.on) drag = { kind: 'tilt', y0: y, t0: game.tiltTarget, id: e.pointerId };
  if (drag && drag.kind === 'pull') { game.phase = 'pull'; game.pull = 0; $('#hint').hidden = true; }
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag || e.pointerId !== drag.id) return;
  const r = canvas.getBoundingClientRect(), y = e.clientY - r.top, x = e.clientX - r.left;
  if (drag.kind === 'tilt') game.tiltTarget = clamp(drag.t0 + (drag.y0 - y) * 0.05, LIM.phi[0], LIM.phi[1]);
  else { const dy = Math.max(0, y - drag.y0), dx = x - drag.x0; game.pull = clamp(Math.hypot(dx * 0.35, dy) / (drag.h * 0.3), 0, 1); }
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  if (d.kind === 'pull') { if (game.pull < 0.06) { game.phase = 'aim'; game.pull = 0; $('#hint').hidden = false; } else throwStone(); }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', function (e) { if (drag && drag.kind === 'pull') { game.phase = 'aim'; game.pull = 0; $('#hint').hidden = false; } drag = null; });
window.addEventListener('keydown', function (e) {
  if (game.phase !== 'aim') return;
  if (e.key === 'ArrowUp') { game.tiltTarget = clamp(game.tiltTarget + 0.5, LIM.phi[0], LIM.phi[1]); e.preventDefault(); }
  if (e.key === 'ArrowDown') { game.tiltTarget = clamp(game.tiltTarget - 0.5, LIM.phi[0], LIM.phi[1]); e.preventDefault(); }
});
document.querySelectorAll('[data-water]').forEach(function (b) {
  b.onclick = function () { if (game.phase === 'aim' || game.phase === 'result') { applyWater(b.dataset.water); if (game.phase === 'result') reset(); } };
});
$('#againBtn').onclick = function () { reset(); };

/* ------------------------------------------------------------------ audio */
let audioStarted = false;
function startAudio() { if (audioStarted) return; audioStarted = true; try { Ocean.audio.start(game.sound); } catch (e) { /* no audio */ } }
$('#soundBtn').onclick = function () {
  startAudio(); game.sound = !game.sound;
  try { Ocean.audio.setOn(game.sound); } catch (e) { /* no audio */ }
  this.setAttribute('aria-pressed', game.sound); this.setAttribute('aria-label', game.sound ? 'Sound on' : 'Sound off');
  $('#sndWave').setAttribute('opacity', game.sound ? '1' : '0.25');
};

/* ------------------------------------------------------------------ throw */
function speedFor(pull) { return LIM.v[0] + (LIM.v[1] - LIM.v[0]) * Math.pow(pull, 0.85); }
const relFrom = new THREE.Vector3(), REL = new THREE.Vector3(0, P.H0, 0);
function throwStone() {
  game.v = speedFor(game.pull);
  game.tilt = game.tiltTarget;
  game.t0 = wt;
  game.sim = P.simulate(game.cond, { theta: THETA, v: game.v, phi: game.tilt, spin: SPIN }, game.t0);
  game.t = -0.12; game.next = 0; game.count = 0; game.sunk = 0; game.doneAt = null;
  relFrom.copy(stone.position);
  trailN = 0; trailGeo.setDrawRange(0, 0);
  game.phase = 'fly';
  $('#hint').hidden = true; $('#tilt').hidden = true; motionBtnShown = !$('#motionBtn').hidden; $('#motionBtn').hidden = true; $('#count').hidden = false; $('#countN').textContent = '0';
  try { Ocean.audio.whoosh(game.v); } catch (e) { /* no audio */ }
}
function reset() {
  game.phase = 'aim'; game.pull = 0; game.sim = null;
  motion.base = null;
  stone.visible = true; stone.scale.setScalar(1);
  trailGeo.setDrawRange(0, 0);
  $('#card').hidden = true; $('#count').hidden = true; $('#hint').hidden = false; $('#tilt').hidden = false; if (motionBtnShown && !motion.on) $('#motionBtn').hidden = false;
}
function verdict(sim) {
  const c = sim.contacts[0];
  if (!c) return { t: 'The stone never reached the water.', ok: false };
  const a = c.alpha.toFixed(0), ideal = (c.alpha - c.err).toFixed(0), w = c.win.toFixed(0);
  if (!c.ok) {
    if (c.why === 'steep') return { t: 'Hit the water at ' + a + '°, too steep. A good entry is about ' + ideal + '° (±' + w + '°). Tilt the stone less.', ok: false };
    if (c.why === 'shallow') return { t: 'Hit the water at ' + a + '°, too flat. A good entry is about ' + ideal + '° (±' + w + '°). Tilt the stone more.', ok: false };
    if (c.why === 'slow') return { t: 'Too slow to bounce. Pull further back before you let go.', ok: false };
    if (c.why === 'hard') return { t: 'It came down too hard and dug in. Throw flatter.', ok: false };
  }
  const last = sim.contacts[sim.contacts.length - 1];
  let why = 'First touch at ' + a + '° (ideal ' + ideal + '°). ';
  if (sim.end === 'sank') why += 'It ran out of speed.';
  else if (last && last.why === 'steep') why += 'It came in too steep at skip ' + last.n + '.';
  else if (last && last.why === 'shallow') why += 'It came in too flat at skip ' + last.n + '.';
  else if (last && last.why === 'slow') why += 'It ran out of speed.';
  else if (last && last.why === 'hard') why += 'It dug in at skip ' + last.n + '.';
  return { t: why, ok: true };
}
function finish() {
  game.phase = 'result';
  const s = game.sim, n = s.skips;
  if (n > game.best) { game.best = n; $('#bestN').textContent = n; try { localStorage.setItem('skipstone-best', String(n)); } catch (e) { /* storage blocked */ } }
  $('#rSkips').textContent = n;
  const last = s.contacts[s.contacts.length - 1];
  $('#rDist').textContent = (last ? last.x : 0).toFixed(1) + ' m';
  $('#rSpeed').textContent = game.v.toFixed(1) + ' m/s';
  const vd = verdict(s); const w = $('#rWhy'); w.textContent = vd.t; w.className = vd.ok ? 'good' : 'bad';
  $('#card').hidden = false; $('#count').hidden = true;
}

/* ------------------------------------------------------------------ overlay: pull ring */
const fx = $('#fx'), fctx = fx.getContext('2d');
function drawFx() {
  const r = canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (fx.width !== Math.round(r.width * dpr)) { fx.width = Math.round(r.width * dpr); fx.height = Math.round(r.height * dpr); }
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.clearRect(0, 0, r.width, r.height);
  if (game.phase !== 'pull' && game.phase !== 'aim') return;
  const s = stoneScreen(), R = Math.max(46, Math.min(r.width, r.height) * 0.12);
  fctx.lineCap = 'round';
  fctx.strokeStyle = 'rgba(255,255,255,0.22)'; fctx.lineWidth = 2;
  fctx.beginPath(); fctx.arc(s.x, s.y, R, 0, Math.PI * 2); fctx.stroke();
  if (game.phase === 'pull') {
    const a0 = -Math.PI / 2;
    fctx.strokeStyle = game.pull > 0.92 ? '#ffb48a' : '#ffffff'; fctx.lineWidth = 4;
    fctx.beginPath(); fctx.arc(s.x, s.y, R, a0, a0 + Math.PI * 2 * game.pull); fctx.stroke();
    fctx.fillStyle = '#ffffff'; fctx.font = '500 14px "IBM Plex Mono", monospace'; fctx.textAlign = 'center';
    fctx.fillText(speedFor(game.pull).toFixed(1) + ' m/s', s.x, s.y - R - 12);
  }
}

/* ------------------------------------------------------------------ environment reflections (once, from the sky) */
function bakeEnv() {
  // a soft studio of the scene's own colours: sky above, warm horizon, sea below, a bright sun patch
  try {
    const pm = new THREE.PMREMGenerator(renderer), envScene = new THREE.Scene();
    const g = new THREE.SphereGeometry(50, 48, 24), col = new Float32Array(g.attributes.position.count * 3), sd = Ocean.sunDir().clone().normalize();
    const top = new THREE.Color(0x5d8fc4), hor = new THREE.Color(0xf0dcc0), sea = new THREE.Color(0x1d4552), c = new THREE.Color(), d = new THREE.Vector3();
    for (let k = 0; k < g.attributes.position.count; k++) {
      d.fromBufferAttribute(g.attributes.position, k).normalize();
      if (d.y >= 0) c.copy(hor).lerp(top, Math.pow(d.y, 0.55)); else c.copy(hor).lerp(sea, Math.min(1, -d.y * 5));
      const s = Math.pow(Math.max(0, d.dot(sd)), 400) * 40 + Math.pow(Math.max(0, d.dot(sd)), 12) * 0.8;
      c.r += s * 1.0; c.g += s * 0.85; c.b += s * 0.6;
      col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    envScene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    scene.environment = pm.fromScene(envScene, 0.03).texture; pm.dispose();
  } catch (e) { /* reflections are optional */ }
}

/* ------------------------------------------------------------------ resize */
function resize() {
  const w = Math.max(10, window.innerWidth), h = Math.max(10, window.innerHeight);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w / h < 0.8 ? 66 : w / h < 1.3 ? 58 : 48; camera.updateProjectionMatrix();
  Ocean.pixelScale(renderer.domElement.height || h, camera.fov);
}
window.addEventListener('resize', resize);
canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); const el = $('#err'); el.hidden = false; el.textContent = 'The graphics context was lost. Reload the page to keep playing.'; });
let fpsEma = 60, lowFor = 0, lowT = 0;
function adaptRes(dt) {
  if (dt > 0) fpsEma += (1 / Math.max(dt, 0.001) - fpsEma) * 0.05;
  lowT += dt;
  if (lowT > 1) { lowT = 0; lowFor = fpsEma < 32 ? lowFor + 1 : 0; if (lowFor >= 2 && pr > 0.75) { pr = Math.max(0.75, pr * 0.85); lowFor = 0; renderer.setPixelRatio(pr); resize(); } }
}

/* ------------------------------------------------------------------ loop */
const tmpP = new THREE.Vector3(), tmpL = new THREE.Vector3();
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  game.tilt += (game.tiltTarget - game.tilt) * Math.min(1, dt * 12);
  if (game.phase === 'aim' || game.phase === 'pull') {
    wt += dt;
    const p = game.phase === 'pull' ? game.pull : 0, shake = p > 0.88 ? (p - 0.88) * 0.02 : 0;
    stone.position.set(HELD.x - 0.07 * p + (Math.random() - 0.5) * shake, HELD.y - 0.012 * p + Math.sin(now / 900) * 0.002 + (Math.random() - 0.5) * shake, HELD.z);
    stone.rotation.set(0, 0, game.tilt * D2R); stoneMesh.rotation.y = 0;
    $('#tiltVal').textContent = game.tilt.toFixed(1) + '°';
    tmpP.copy(EYE); tmpL.copy(LOOK);
  } else if (game.phase === 'fly') {
    const s = game.sim;
    game.t += dt;
    wt = game.t0 + Math.max(0, game.t);
    if (game.t < 0) {                                             // the stone leaves the hand: ease to the release point
      const u = 1 + game.t / 0.12, e = u * u * (3 - 2 * u);
      stone.position.lerpVectors(relFrom, REL, e);
    } else {
      while (game.next < s.contacts.length && game.t >= s.contacts[game.next].t) {
        const c = s.contacts[game.next];
        Ocean.splash(c.x, 0, c.ok ? 0.2 + Math.min(0.25, c.speed / 80) : 0.45);
        try { if (c.ok) Ocean.audio.skip(c.x, 0, c.speed); else Ocean.audio.splash(c.x, 0, 1.3); } catch (e) { /* no audio */ }
        if (c.ok) { game.count++; $('#countN').textContent = game.count; } else game.sunk = 0.0001;
        game.next++;
      }
      const failed = s.contacts.length && !s.contacts[s.contacts.length - 1].ok;
      if (game.sunk > 0) {
        game.sunk += dt;
        const lc = s.contacts[s.contacts.length - 1];
        stone.position.set(lc.x + 0.2 * game.sunk, lc.y - 0.05 - game.sunk * 0.7, 0);
        if (game.sunk > 0.6) stone.visible = false;
      } else {
        const q = P.stateAt(s, game.t);
        stone.position.set(q.x, q.y + 0.01, 0);
        stoneMesh.rotation.y += dt * (25 + q.spin * 60);
        if (trailN < TRAIL_MAX) { trailPos[trailN * 3] = q.x; trailPos[trailN * 3 + 1] = q.y + 0.01; trailPos[trailN * 3 + 2] = 0; trailN++; trailGeo.attributes.position.needsUpdate = true; trailGeo.setDrawRange(0, trailN); }
      }
      if (failed && game.sunk > 1.0 && game.doneAt === null) game.doneAt = game.t;
      if (!failed && game.t > s.duration + 0.5 && game.doneAt === null) game.doneAt = game.t;
      if (game.doneAt !== null && game.t > game.doneAt + 0.3) finish();
    }
    // follow from behind and to the side so the bounces read
    const sx = stone.position.x;
    tmpP.set(Math.max(EYE.x, sx - 1.9), 0.62, 0.7); tmpL.set(sx + 3.5, 0.0, -0.1);
  } else {                                                        // result: hold on the last view
    wt += dt;
    const lc = game.sim.contacts[game.sim.contacts.length - 1], sx = lc ? lc.x : 0;
    tmpP.set(Math.max(EYE.x, sx - 3.2), 0.9, 1.1); tmpL.set(sx + 2.5, 0.0, -0.1);
  }
  const k = game.phase === 'fly' ? 1 - Math.exp(-dt * 7) : 1 - Math.exp(-dt * 4);
  camPos.lerp(tmpP, k); camLook.lerp(tmpL, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  stone.rotation.z = game.tilt * D2R;
  Ocean.update(wt - wtPrev, wt); wtPrev = wt;
  try { Ocean.audio.tick(dt); } catch (e) { /* no audio */ }
  Ocean.follow();
  renderer.render(scene, camera);
  drawFx();
  adaptRes(dt);
}

/* ------------------------------------------------------------------ boot */
applyWater('lake');
resize();
Ocean.update(0.016, 0); Ocean.follow();
bakeEnv();
requestAnimationFrame(function (t) { last = t; tick(t); });
window.__skip = { game: game, motion: motion, scene: scene, stoneMat: stoneMat, stone: stone, camera: camera, throwWith: function (tilt, pull) { game.tiltTarget = game.tilt = tilt; game.pull = pull; throwStone(); } };

})();
</script>

</body>
</html>
